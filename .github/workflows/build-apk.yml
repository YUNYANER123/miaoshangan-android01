name: Build Android APK

# 在 push 到 main/master 或手动触发时，自动构建并上传可安装的 debug APK。
# 整个过程不需要你本机装 Android Studio —— GitHub 的免费机器帮你编译。
on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 本仓库（安卓包装）
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装 Capacitor CLI
        run: npm install

      - name: 拉取最新网页资源（来自 kaoyan28 仓库）
        run: |
          git clone --depth 1 https://github.com/YUNYANER123/kaoyan28.git _web
          mkdir -p www
          # kaoyan28 仓库根目录本身就是网页应用（index.html / js / sw.js 等）
          cp -r _web/. www/
          rm -rf www/.git _web
          echo "---- www 内容 ----"
          ls -la www

      - name: 添加安卓平台并同步资源
        run: |
          npx cap add android
          npx cap sync android

      - name: 生成应用图标（猫咪图标）
        run: npx @capacitor/assets generate --android

      - name: 注入原生桌面小组件（7 个 App Widget）
        run: node native-widgets/apply-patch.cjs

      # 版本号每次构建都递增（versionCode / versionName 用 run_number），
      # 且 APK 文件名带上版本号 —— 这样每个包的文件名都不同，
      # 避免「文件名永远叫 miao-app-debug.apk、版本永远显示 1.0」导致装到缓存旧包、
      # 分不清自己装的到底是哪一版。
      - name: 递增版本号（便于区分不同构建）
        run: |
          VCODE=${{ github.run_number }}
          VNAME="1.${{ github.run_number }}"
          echo "VCODE=$VCODE" >> $GITHUB_ENV
          echo "VNAME=$VNAME" >> $GITHUB_ENV
          sed -i "s/versionCode[ ]*[0-9][0-9]*/versionCode $VCODE/" android/app/build.gradle
          sed -i "s/versionName[ ]*\"[^\"]*\"/versionName \"$VNAME\"/" android/app/build.gradle
          echo "---- 版本设置结果 ----"
          grep -n "versionCode\|versionName" android/app/build.gradle || true

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        run: |
          ANDROID_HOME=$HOME/android-sdk
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          mkdir -p $ANDROID_HOME/cmdline-tools
          curl -sSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdtools.zip
          unzip -q /tmp/cmdtools.zip -d $ANDROID_HOME/cmdline-tools
          mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      # 固定签名密钥：第一次运行在仓库内生成 native-widgets/debug.keystore 并写回 main，
      # 之后所有构建复用同一把密钥 → APK 签名一致 → 可「覆盖安装」无需卸载重装。
      # 注：用 checkout 注入的令牌推送，并清掉 http.extraheader，避免「URL 内联 token + extraheader」
      # 两套认证冲突导致 401（密钥写不回仓库就会每次重新生成 → 一直签名冲突）。
      - name: 准备固定签名密钥（覆盖安装不再报签名冲突）
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          KEY=native-widgets/debug.keystore
          if [ ! -f "$KEY" ]; then
            echo "首次运行：生成固定 debug 签名密钥并写回仓库..."
            keytool -genkeypair -v -keystore "$KEY" -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
            git config user.email "ci@miao.local"
            git config user.name "Miao CI"
            git add "$KEY"
            git commit -m "ci: 新增固定 debug 签名密钥（支持 APK 覆盖安装）"
            # 清掉 checkout 注入的 extraheader，改为在 remote URL 内置令牌，避免「两套认证」冲突
            git config --unset-all http.extraheader || true
            git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/YUNYANER123/miaoshangan-android01.git"
            git push origin HEAD:main
            echo "已把固定密钥写回 main。"
          else
            echo "仓库内已有固定密钥，直接复用。"
          fi
          mkdir -p "$HOME/.android"
          cp "$KEY" "$HOME/.android/debug.keystore"
          echo "keystore ready: $(ls -l "$HOME/.android/debug.keystore")"

      - name: 构建 debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: 整理 APK 产物
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk "dist/miao-app-debug-v${VNAME}.apk"
          ls -la dist

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: miao-app-debug
          path: dist/*.apk

      # 发布成 GitHub Release，让手机用户能直接下载单文件 APK（无需解压 zip）
      - name: 删除旧的滚动 Release（如有）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete apk-latest --yes --cleanup-tag || true

      - name: 发布 APK 到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: 喵上岸 APK（自动构建 v${{ github.run_number }}）
          draft: false
          prerelease: false
          body: |
            由 GitHub Actions 自动构建的 debug 安装包。
            版本：${{ github.run_number }}（versionCode / versionName = 1.${{ github.run_number }}）
            文件名已带版本号，下载后请确认文件名与版本号，避免装到旧包。
            在安卓上允许「未知来源」安装即可。

            注意：由于早期版本使用随机签名，已装的旧版需**卸载一次**；
            之后所有构建共用同一把固定签名密钥，可直接覆盖安装。
          files: dist/*.apk
